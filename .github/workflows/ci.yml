name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        # vendored vigem-client keeps upstream formatting; check only our crates.
        # Naming crates individually is how ksx-api, ksx-hidmaestro, ksx-studio,
        # ksx-cabinet and ksx-fuzz went unchecked from the day each was created,
        # so the list is derived instead: every workspace member but the vendor.
        shell: pwsh
        run: |
          $members = cargo metadata --no-deps --format-version 1 |
            ConvertFrom-Json |
            Select-Object -ExpandProperty packages |
            Where-Object name -ne 'vigem-client' |
            ForEach-Object { '-p', $_.name }
          Write-Host "fmt: $($members -join ' ')"
          cargo fmt --check @members
      - name: Clippy
        run: cargo clippy --workspace --exclude vigem-client --all-targets -- -D warnings
      - name: Test
        # Driver-touching tests are behind the `cab-tests` feature and never run here.
        # The vendored vigem-client's integration tests need the ViGEmBus driver: compile-check only.
        run: cargo test --workspace --exclude vigem-client
      # `studio` and `cabinet` are independent opt-ins, so the default build
      # compiles neither and CI never saw the code behind them. Three separate
      # breakages reached master that way (87701cd, 4200214, 4135a7b's dead
      # LearnService::refusing), each caught by a local gate CI did not run.
      # Compile every combination the release build can ship.
      - name: Feature matrix (clippy, all four combinations)
        shell: pwsh
        run: |
          foreach ($f in @('', 'studio', 'cabinet', 'studio,cabinet')) {
            $label = if ($f) { $f } else { '<default>' }
            Write-Host "::group::features: $label"
            if ($f) {
              cargo clippy -p ksx-app --all-targets --features $f -- -D warnings
            } else {
              cargo clippy -p ksx-app --all-targets -- -D warnings
            }
            if ($LASTEXITCODE -ne 0) { throw "feature combination '$label' failed" }
            Write-Host '::endgroup::'
          }
      - name: Check vendored vigem-client compiles
        run: cargo check -p vigem-client --all-features

  # The shippable binary is built HERE, not on a developer machine, and that is
  # deliberate. On 2026-08-07 the primary dev box (i9-14900K) began crashing
  # rustc during `cargo build --release`: three runs on a byte-identical command
  # line died three different ways (0xc0000409 twice in different crates, then
  # 0xc0000005), with 28GB of 64GB free — so not OOM. A deterministic compiler
  # that fails non-deterministically is hardware corrupting compute, and the
  # release profile below (opt-level=3 + thin LTO + codegen-units=1) is the
  # heaviest sustained load in the build, which is why it surfaces there first.
  #
  # The danger is NOT the crash. A crash is loud and safe. The danger is the run
  # that *succeeds* on marginal hardware and emits a silently miscompiled binary
  # — which then goes onto an arcade cabinet and misbehaves with no error
  # anywhere to explain it. A clean runner removes that class of risk entirely.
  #
  # Keep this job even after the CPU is replaced: it also means anyone can get a
  # working ksx.exe without a Rust toolchain.
  release-binary:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cabinet + studio is the shipping combination: the egui panel UI plus the
      # local web config server. The feature matrix above proves it compiles;
      # this builds it optimized.
      - name: Build release
        run: cargo build --release --features cabinet,studio
      # Print the hash in the log so a downloaded artifact can be verified
      # against the run that produced it.
      - name: Hash
        shell: pwsh
        run: |
          $exe = 'target/release/ksx.exe'
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "ksx.exe  $mb MB"
          Write-Host "SHA256   $h"
          "### ksx.exe`n`n- size: $mb MB`n- SHA256: ``$h```n- commit: ``$env:GITHUB_SHA``" |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: ksx-windows-x86_64
          path: target/release/ksx.exe
          if-no-files-found: error
          retention-days: 30
