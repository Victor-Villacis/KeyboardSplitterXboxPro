[package]
name = "ksx-launcher"
description = "Console-free Windows launcher for the customer-facing ksx shortcut."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ksx-launcher"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# Keep the shortcut's icon and the file's Details tab consistent with ksx.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
