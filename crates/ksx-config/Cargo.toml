[package]
name = "ksx-config"
description = "TOML configuration: config.toml, presets/*.toml, games.toml — load/save/versioning/paths."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ksx-core.workspace = true
serde.workspace = true
serde_ignored.workspace = true
# JSON interop (`ksx config export|import`, `presets/*.json`). TOML stays
# canonical — it carries the comments; JSON is the machine-readable twin, and
# both go through the same serde types so they cannot drift (src/interop.rs).
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true
