[package]
name = "ksx-app"
description = "ksx — split keyboards (I-PAC arcade encoders) into virtual Xbox 360 controllers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ksx"
path = "src/main.rs"

[dependencies]
ksx-core.workspace = true
ksx-config.workspace = true
ksx-legacy-import.workspace = true
ksx-capture.workspace = true
ksx-output.workspace = true
ksx-platform.workspace = true
ksx-games.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# SetConsoleCtrlHandler for `ksx pads` (no ctrlc crate — one API, one AtomicBool).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
insta.workspace = true
