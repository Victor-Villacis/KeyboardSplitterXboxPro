[package]
name = "ksx-app"
description = "ksx — split keyboards (I-PAC arcade encoders) into virtual Xbox 360 controllers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ksx"
path = "src/main.rs"

[dependencies]
ksx-core.workspace = true
ksx-config.workspace = true
ksx-legacy-import.workspace = true
ksx-capture.workspace = true
ksx-output.workspace = true
ksx-platform.workspace = true
ksx-games.workspace = true
anyhow.workspace = true
# `capture::SetupError` is matched on for a stable --json error code, so it is a
# typed enum rather than an anyhow::Error.
thiserror.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
# Capture→submit latency histogram for `ksx run` (p50/p99/max). A permanent
# debug feature per docs/ARCHITECTURE.md rule 5, not a one-off measurement.
hdrhistogram.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# SetConsoleCtrlHandler for `ksx pads`/`ksx run` (no ctrlc crate — one API, one
# AtomicBool), QPC for the latency clock, Beep for the escape-toggle audio cue.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Performance",
] }

[dev-dependencies]
insta.workspace = true
# Plan-resolution tests build ConfigFile/GamesFile/PresetFile from literal TOML.
toml.workspace = true
