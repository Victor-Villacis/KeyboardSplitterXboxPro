[package]
name = "ksx-platform"
description = "Windows plumbing: hotplug notifications, driver state/signature/CI-policy checks, install orchestration, autostart."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# `inject` speaks the same key vocabulary the capture layer produces, so a
# re-injected stroke is the exact inverse of the one that was captured.
ksx-core.workspace = true
serde.workspace = true
# `installer`/`autostart` build their `--json` payloads here, not just in tests.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_Storage_FileSystem",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
] }
# `process` uses the lightweight bindings (Toolhelp, ShellExecuteW, token
# elevation) that ksx-app and ksx-capture already link.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # `inject`: SendInput/KEYBDINPUT.
    "Win32_UI_Input_KeyboardAndMouse",
    # `winusb`: CM_Get_Device_ID_ListW — read-only present-device enumeration.
    # Nothing here opens, claims, or configures a device.
    "Win32_Devices_DeviceAndDriverInstallation",
    # `xinput`: XInputGetState over indices 0..MAX_XINPUT_SLOTS — the only way
    # to learn how many of Windows' four slots are actually taken. Counting
    # ViGEmBus children answers a different question (see xinput.rs).
    "Win32_UI_Input_XboxController",
] }

[dev-dependencies]
serde_json.workspace = true

[features]
# Tests that assert THIS cabinet's known driver state (ScpVBus present,
# Interception live, expired cross-signed cert, {784C4414-…} CI audit policy).
# Only ever run on the cabinet, never CI.
cab-tests = []
